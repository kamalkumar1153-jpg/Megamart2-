<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megamart</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Header Banner -->
  <header class="header">
    <h1 class="logo">Megamart</h1>
    <button onclick="openCartModal()" class="cart-btn">
      <i class="fa-solid fa-cart-shopping"></i> Cart
      <span id="cartCount" class="cart-count">0</span>
    </button>
  </header>

  <!-- Offer Bar -->
  <div class="offer-bar">
    30% OFF Special Mega Store Discount
  </div>

  <!-- Search Section -->
  <div class="search-container">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Search products...">
      <button id="clearSearchBtn" onclick="clearSearch()">&times;</button>
    </div>
  </div>

  <!-- Category Filters -->
  <div class="category-bar">
    <button class="filter-btn active" onclick="filterCategory('all', this)">All</button>
    <button class="filter-btn" onclick="filterCategory('grocery', this)">Grocery</button>
    <button class="filter-btn" onclick="filterCategory('electronics', this)">Electronics</button>
    <button class="filter-btn" onclick="filterCategory('fashion', this)">Fashion</button>
  </div>

  <!-- Product Grid -->
  <main>
    <div id="productGrid" class="product-grid">
      <p class="loading-text">Products load ho rahe hain...</p>
    </div>
  </main>

  <!-- Product Modal -->
  <div id="prodModal" class="modal">
    <div class="modal-content">
      <button onclick="closeModal('prodModal')" class="close-btn">&times;</button>
      <img id="m-img" src="" class="modal-img">
      <h3 id="m-title" class="modal-title"></h3>
      <div id="m-price" class="modal-price"></div>
      
      <div class="modal-actions">
        <button onclick="addSelectedToCart()" class="btn-cart">Add to Cart</button>
        <a id="m-wa" href="#" target="_blank" class="btn-wa">
          <i class="fa-brands fa-whatsapp"></i> Buy Now
        </a>
      </div>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Your Cart</h3>
        <button onclick="closeModal('cartModal')" class="close-btn">&times;</button>
      </div>

      <div id="cartList" class="cart-list"></div>

      <div id="checkoutSection" class="checkout-section">
        <div class="total-row">
          <span>Total:</span>
          <span class="total-price">₹<span id="cartTotal">0</span></span>
        </div>

        <input type="text" id="custName" placeholder="Apna Naam bharein" class="form-input">
        <input type="tel" id="custPhone" placeholder="Mobile Number bharein" class="form-input">

        <button onclick="sendWhatsAppOrder()" class="btn-order">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Par Order Karein
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
